<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Levelstair</title>
  <desc id="d">Levelstair banner: a raven perched on a golden staircase beside the Levelstair wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#13213F"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    .raven .body { fill: #17305A; stroke: #9ADCFF; stroke-width: 3; stroke-linejoin: round; }
    .raven .wing { fill: #9ADCFF; opacity: 0.85; }
    .raven .eye { fill: #F2C14E; }
    .raven .leg { fill: none; stroke: #F2C14E; stroke-width: 4; stroke-linecap: round; }
    .word { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 104px; letter-spacing: 2px; fill: #F4FAFF; }
    .sub { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 3px; fill: #B7D4EA; }
  </style>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g fill="#9ADCFF" opacity="0.55">
    <circle cx="640" cy="40" r="2"/><circle cx="760" cy="26" r="1.6"/><circle cx="900" cy="48" r="2"/>
    <circle cx="1040" cy="30" r="1.6"/><circle cx="1130" cy="70" r="2"/><circle cx="560" cy="70" r="1.6"/>
    <circle cx="990" cy="250" r="1.6"/><circle cx="1110" cy="226" r="2"/><circle cx="700" cy="268" r="1.6"/>
  </g>
  <g>
    <rect x="70" y="244" width="62" height="16" rx="3" fill="url(#step)"/>
    <rect x="132" y="228" width="62" height="32" rx="3" fill="url(#step)"/>
    <rect x="194" y="212" width="62" height="48" rx="3" fill="url(#step)"/>
    <rect x="256" y="196" width="62" height="64" rx="3" fill="url(#step)"/>
  </g>
  <g class="raven" transform="translate(185 22) scale(0.9)">
    <path class="body" d="M6 152 L30 118 L62 110 C80 88 110 78 134 80 C140 64 156 56 172 62 C186 62 198 68 200 82 C190 84 182 88 174 88 C172 102 160 120 148 134 C132 154 104 158 78 152 L40 146 Z"/>
    <path class="wing" d="M62 120 C82 98 118 94 146 108 C130 136 100 148 54 142 Z"/>
    <circle class="eye" cx="158" cy="72" r="4"/>
    <path class="leg" d="M96 154 L94 193 M114 150 L114 193"/>
  </g>
  <rect x="396" y="86" width="6" height="128" rx="3" fill="#F2C14E"/>
  <text class="word" x="426" y="170">Level<tspan fill="#9ADCFF">stair</tspan></text>
  <text class="sub" x="430" y="214">GAMES · ANIMATION · XR · TALENT</text>
  <text x="430" y="246" style="font-family:'Segoe UI',Arial,sans-serif;font-weight:700;font-size:18px;letter-spacing:5px;fill:#F2C14E">SRI LANKA</text>
